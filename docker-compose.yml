version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: himlayan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: himlayan
      POSTGRES_PASSWORD: ${DB_PASSWORD:-himlayan_secret_2024}
      POSTGRES_DB: himlayan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U himlayan"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - himlayan-network

  redis:
    image: redis:7-alpine
    container_name: himlayan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - himlayan-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: himlayan-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://himlayan:${DB_PASSWORD:-himlayan_secret_2024}@postgres:5432/himlayan
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-random-string}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-to-another-secure-random-string}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-encryption-key-min-32-chars!!}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - himlayan-network

volumes:
  postgres_data:
    driver: local

networks:
  himlayan-network:
    driver: bridge
